<script>
// الرابط الخاص بـ Google Apps Script Web App
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwq5IeH5o-OUBq37iRSoY6gouwYQK-kzG9qX37Qca3CgU-QzO9dAF0iYxnlO1orZxz5/exec";

// جلب البيانات عند فتح الصفحة وإعادة التحديث التلقائي كل 30 ثانية
window.onload = function() {
    fetchData();
    setInterval(fetchData, 30000); 
};

async function fetchData() {
    try {
        let response = await fetch(SCRIPT_URL);
        let data = await response.json();
        setupDropdowns(data);
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}

function setupDropdowns(data){
    fillSelect('area', data.areas, 'اختر المنطقة السكنية');
    fillSelect('route', data.routes, 'اختر باص رووت');
    fillSelect('grade', data.grades, 'اختر الفرقة الدراسية');
}

function fillSelect(id, items, placeholderText){
    var s = document.getElementById(id);
    var currentVal = s.value; 
    s.innerHTML = '<option value="" disabled ' + (currentVal ? '' : 'selected') + '>' + placeholderText + '</option>';
    
    if(items && items.length > 0) {
        items.forEach(function(i){
            var o = document.createElement('option');
            o.value = i;
            o.text = i;
            if(i === currentVal) o.selected = true; 
            s.appendChild(o);
        });
    }
}

function closePopup(){
    document.getElementById('popupOverlay').style.display='none';
}

async function handleFormSubmit(event){
    event.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "جاري الحجز...";
    
    var packet = {
        studentName: document.getElementById('studentName').value,
        nationalId: document.getElementById('nationalId').value,
        mobile: document.getElementById('mobile').value,
        address: document.getElementById('address').value,
        grade: document.getElementById('grade').value,
        area: document.getElementById('area').value,
        route: document.getElementById('route').value
    };
    
    try {
        let response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(packet)
        });
        
        let res = await response.json();
        
        btn.disabled = false;
        btn.innerText = "تأكيد الحجز";
        
        if(res.success){
            document.getElementById('popupCode').innerText = res.bookingCode || "غير متاح";
            document.getElementById('popupOverlay').style.display='flex';
            document.getElementById('busForm').reset();
        } else {
            alert(res.message || "حدث خطأ ما");
        }
    } catch (error) {
        console.error('Error:', error);
        btn.disabled = false;
        btn.innerText = "تأكيد الحجز";
        alert("فشل الاتصال بالسيرفر. تأكد من إعدادات جوجل سكريبت كـ API.");
    }
}
</script>
