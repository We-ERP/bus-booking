*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;min-height:100vh;background:radial-gradient(circle at center,#11959e 0%,#0d7b82 100%);display:flex;justify-content:center;align-items:center;overflow-x:hidden;position:relative;padding:20px 0;color:#fff}

/* حركات زجزاجية للملصقات */
@keyframes zigzag1 { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(15px, -20px) rotate(8deg); } 66% { transform: translate(-15px, -40px) rotate(-8deg); } }
@keyframes zigzag2 { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(-20px, -25px) rotate(-10deg); } 66% { transform: translate(20px, -45px) rotate(10deg); } }

.l1 { left: 12%; top: 4%; width: 130px; animation: zigzag1 8s infinite; }
.l2 { left: 18%; top: 18%; width: 140px; animation: zigzag2 10s infinite; }
.l3 { left: 10%; top: 30%; width: 125px; animation: zigzag1 9s infinite; }
.l4 { left: 16%; top: 42%; width: 135px; animation: zigzag2 11s infinite; }
.l5 { left: 12%; top: 54%; width: 130px; animation: zigzag1 7s infinite; }
.l6 { left: 18%; top: 66%; width: 145px; animation: zigzag2 12s infinite; }
.l7 { left: 10%; top: 78%; width: 125px; animation: zigzag1 8.5s infinite; }

.input-group{margin-bottom:12px}
input,select{width:100%;padding:12px;border:none;border-radius:10px;font-family:Cairo;font-size:14px;outline:none;background:#fff; color:#333}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#c4963b;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #a3792a;transition:all 0.1s}
button:hover{background:#d4a545}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a3792a}
button:disabled {background:#999; box-shadow:0 6px 0 #666; cursor: not-allowed;}

/* زرار الإدارة */
.admin-btn {position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.15); width:40px; height:40px; padding:0; border: none; color: #fff; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 18px; box-shadow: none;}
.admin-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); box-shadow: none;}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:9999; backdrop-filter: blur(5px);}
.popup{background:#fff;color:#333;padding:25px;border-radius:20px;text-align:center;width:90%;max-width:400px; position:relative;}
.popup.admin-panel {max-width: 800px; max-height: 90vh; overflow-y: auto;}
.popup .close-btn {position:absolute; top:15px; right:15px; background:none; box-shadow:none; color:#ff4d4d; width:auto; padding:0; font-size:24px;}
.popup .code{color:#8b0000;font-weight:900;font-size:22px;margin:15px 0;display:block; direction: ltr; unicode-bidi: isolate;}

/* جدول الأدمن */
.admin-table-container {overflow-x: auto; margin: 15px 0;}
table {width: 100%; border-collapse: collapse; min-width: 500px;}
th, td {border: 1px solid #ddd; padding: 10px; text-align: center; font-size:14px;}
th {background: #11959e; color: #fff;}
td input {padding: 6px; border: 1px solid #ccc; border-radius: 5px; width: 100%; text-align:center;}

.delete-btn {background: #ff4d4d; box-shadow: 0 3px 0 #cc0000;}

/* كارت التواصل المعدل */
.contact-section{margin-top:25px;text-align:center;padding:20px;background:rgba(0,0,0,0.2);border-radius:15px;border:1px solid rgba(255,255,255,0.1);box-shadow:inset 0 0 10px rgba(0,0,0,0.1);font-size:14px}
.contact-section a{color:#f7ce74;text-decoration:none;display:block;margin:10px 0;transition:all 0.3s ease;}

.whatsapp-btn:hover {transform:translateY(-2px) !important;}

@media(max-width:1100px){.sticker{display:none}}
</style>
</head>

<!-- نافذة تسجيل دخول الإدارة -->
<div id="loginOverlay" class="overlay">
    <div class="popup">

        <button class="close-btn" onclick="closeOverlay('adminOverlay')"><i class="fas fa-times"></i></button>
        <h2 style="color:#11959e; font-size:22px;">لوحة تحكم البيانات (شيت Data)</h2>

</div>

<!-- الكونتينر الرئيسي -->
<div class="container-3d">
    <button class="admin-btn" onclick="openLogin()" title="لوحة الإدارة"><i class="fas fa-user-shield"></i></button>
    
    <img src="https://i.ibb.co/gF7v68zg/pngtree-a-happy-cartoon-school-bus-filled-with-diverse-cheerful-waving-children-png-image-16670445.webp" class="static-bus">

    <h2>حجز باصات المدرسة</h2>
    <form id="busForm" onsubmit="handleFormSubmit(event)">
        <div class="input-group"><input type="text" id="studentName" placeholder="إسم الطالب" required></div>
        <div class="input-group"><input type="text" inputmode="numeric" pattern="[0-9]{14}" maxlength="14" id="nationalId" placeholder="الرقم القومي (14 رقم)" required oninput="this.value = this.value.replace(/[^0-9]/g, '');"></div>
        <div class="input-group"><input type="tel" pattern="[0-9]{11}" maxlength="11" id="mobile" placeholder="رقم موبايل ولي الأمر (11 رقم)" required oninput="this.value = this.value.replace(/[^0-9]/g, '');"></div>

        <div class="input-group"><select id="route" required><option value="" disabled selected>اختر باص رووت</option></select></div>
        <button type="submit" id="submitBtn">تأكيد الحجز</button>

<script>
// --- هام: ضع رابط الـ Web App الجديد هنا بعد التعديل ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwq5IeH5o-OUBq37iRSoY6gouwYQK-kzG9qX37Qca3CgU-QzO9dAF0iYxnlO1orZxz5/exec";

// جلب بيانات القوائم المنسدلة
window.onload = function() {
    fetchData();
    setInterval(fetchData, 30000); 
};

async function fetchData() {
    try {
        let response = await fetch(SCRIPT_URL + "?action=getDropdowns");
        let data = await response.json();
        setupDropdowns(data);
    } catch (error) {
        console.error('Error fetching data:', error);
    }
}

function setupDropdowns(data){
    fillSelect('area', data.areas, 'اختر المنطقة السكنية');
    fillSelect('route', data.routes, 'اختر باص رووت');
    fillSelect('grade', data.grades, 'اختر الفرقة الدراسية');
}

function fillSelect(id, items, placeholderText){
    var s = document.getElementById(id);
    var currentVal = s.value; 
    s.innerHTML = '<option value="" disabled ' + (currentVal ? '' : 'selected') + '>' + placeholderText + '</option>';
    if(items && items.length > 0) {
        items.forEach(function(i){
            var o = document.createElement('option');
            o.value = i; o.text = i;
            if(i === currentVal) o.selected = true; 
            s.appendChild(o);
        });
    }
}

function closeOverlay(id){ document.getElementById(id).style.display='none'; }
function openLogin(){ document.getElementById('loginOverlay').style.display='flex'; }

// 1. عملية الحجز العادية
async function handleFormSubmit(event){
    event.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerText = "جاري الحجز...";
    
    var packet = {
        action: 'reserve', // إرسال الأكشن للسيرفر
        studentName: document.getElementById('studentName').value,
        nationalId: document.getElementById('nationalId').value,
        mobile: document.getElementById('mobile').value,
        address: document.getElementById('address').value,
        grade: document.getElementById('grade').value,
        area: document.getElementById('area').value,
        route: document.getElementById('route').value
    };
    
    try {
        let response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(packet)
        });
        let res = await response.json();
        btn.disabled = false; btn.innerText = "تأكيد الحجز";
        
        if(res.success){
            document.getElementById('popupCode').innerText = res.bookingCode || "غير متاح";
            document.getElementById('popupOverlay').style.display='flex';
            document.getElementById('busForm').reset();
        } else {
            alert(res.message || "حدث خطأ ما");
        }
    } catch (error) {
        btn.disabled = false; btn.innerText = "تأكيد الحجز";
        alert("فشل الاتصال بالسيرفر. تأكد من إعدادات السكريبت.");
    }
}

// 2. تسجيل دخول الأدمن
async function handleLogin(event){
    event.preventDefault();
    var btn = document.getElementById('loginBtn');
    var u = document.getElementById('adminUser').value;
    var p = document.getElementById('adminPass').value;
    
    btn.disabled = true; btn.innerText = "جاري التحقق...";
    
    try {
        let response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: 'login', user: u, pass: p})
        });
        let res = await response.json();
        btn.disabled = false; btn.innerText = "دخول";
        
        if(res.success){
            closeOverlay('loginOverlay');
            document.getElementById('loginForm').reset();
            loadAdminData(); // جلب الداتا وعرض اللوحة
        } else {
            alert("بيانات الدخول غير صحيحة!");
        }
    } catch(e) {
        btn.disabled = false; btn.innerText = "دخول";
        alert("فشل الاتصال بالسيرفر.");
    }
}

// 3. جلب بيانات الأدمن وتعبئة الجدول
async function loadAdminData(){
    document.getElementById('adminOverlay').style.display='flex';
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">جاري التحميل...</td></tr>';
    
    try {
        let response = await fetch(SCRIPT_URL + "?action=getAdminData");
        let data = await response.json();
        renderTable(data.rows);
    } catch(e) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color:red;">فشل جلب البيانات</td></tr>';
    }
}

function renderTable(rows){
    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if(!rows || rows.length === 0){ return; }
    
    rows.forEach(function(row){
        addRowToTable(row[0] || "", row[1] || "", row[2] || "");
    });
}

function addRowToTable(val1 = "", val2 = "", val3 = ""){
    var tbody = document.getElementById('tableBody');
    var tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" value="${val1}"></td>
        <td><input type="text" value="${val2}"></td>
        <td><input type="text" value="${val3}"></td>
        <td><button class="action-btn delete-btn" onclick="this.parentElement.parentElement.remove()"><i class="fas fa-trash"></i></button></td>
    `;
    tbody.appendChild(tr);
}
function addNewRow(){ addRowToTable("", "", ""); }

// 4. حفظ البيانات الجديدة في شيت Data
async function saveAdminData(){
    var btn = document.getElementById('saveDataBtn');
    btn.disabled = true; btn.innerText = "جاري الحفظ...";
    
    var rows = [];
    var trs = document.getElementById('tableBody').getElementsByTagName('tr');
    for(var i=0; i<trs.length; i++){
        var inputs = trs[i].getElementsByTagName('input');
        if(inputs.length >= 3){
            rows.push([inputs[0].value.trim(), inputs[1].value.trim(), inputs[2].value.trim()]);
        }
    }
    
    try {
        let response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: 'updateData', rows: rows})
        });
        let res = await response.json();
        btn.disabled = false; btn.innerText = "حفظ التعديلات في الشيت";
        if(res.success){
            alert("تم الحفظ بنجاح وتحديث الشيت!");
            fetchData(); // تحديث القوائم العادية
        } else {
            alert("حدث خطأ أثناء الحفظ.");
        }
    } catch(e) {
        btn.disabled = false; btn.innerText = "حفظ التعديلات في الشيت";
        alert("فشل الاتصال.");
    }
}

// 5. تحميل شيت الحجز
async function downloadReserveSheet(){
    var btn = document.getElementById('downloadBtn');
    var originalText = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
    
    try {
        let response = await fetch(SCRIPT_URL + "?action=downloadReserve");
        let res = await response.json();
        btn.disabled = false; btn.innerHTML = originalText;
        
        if(res.success && res.csv){
            var blob = new Blob(["\uFEFF" + res.csv], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement("a");
            var url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Reservations.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } else {
            alert("لم يتم العثور على بيانات لتحميلها.");
        }
    } catch(e) {
        btn.disabled = false; btn.innerHTML = originalText;
        alert("خطأ أثناء التحميل.");
    }
}
</script>
